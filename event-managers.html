<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Managers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .sidebar { min-height: 100vh; background-color: #343a40; }
    .sidebar .nav-link { color: rgba(255,255,255,.75); }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background-color: rgba(255,255,255,.1); }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-2 sidebar p-0">
      <div class="p-3 text-white"><h4>Admin Dashboard</h4><hr class="bg-light"></div>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="admin.html"><i class="fas fa-users me-2"></i>Workers</a></li>
        <li class="nav-item"><a class="nav-link" href="salary.html"><i class="fas fa-wallet me-2"></i>Salary Payment</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html#records"><i class="fas fa-clipboard-list me-2"></i>All Records</a></li>
        <li class="nav-item"><a class="nav-link active" href="event-managers.html"><i class="fas fa-user-tie me-2"></i>Event Managers</a></li>
        <li class="nav-item mt-3">
          <button onclick="logout()" class="btn btn-outline-light w-95 mx-2">Logout</button>
        </li>
      </ul>
    </div>

    <div class="col-md-10 p-4">
      <h3 class="mb-4"><i class="fas fa-user-tie me-2"></i>Event Managers</h3>
      
      <div class="card mb-4">
        <div class="card-body">
          <form id="addEventManagerForm" class="row g-2">
            <div class="col-md-8">
              <input type="text" id="eventManagerName" class="form-control" placeholder="Enter Event Manager Name" required>
            </div>
            <div class="col-md-4">
              <button type="submit" class="btn btn-primary w-100">Add Event Manager</button>
            </div>
          </form>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Added On</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="eventManagersTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const db = firebase.firestore();

function logout() {
  localStorage.clear();
  window.location.href = "admin.html";
}

async function loadEventManagers() {
  const tbody = document.getElementById('eventManagersTable');
  tbody.innerHTML = '<tr><td colspan="3" class="text-center">Loading...</td></tr>';
  
  const snapshot = await db.collection('eventManagers').orderBy('name').get();
  tbody.innerHTML = '';
  
  if (snapshot.empty) {
    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No event managers added yet</td></tr>';
    return;
  }
  
  snapshot.forEach(doc => {
    const data = doc.data();
    const date = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString() : '—';
    tbody.innerHTML += `
      <tr>
        <td>${data.name}</td>
        <td>${date}</td>
        <td>
          <button onclick="deleteEventManager('${doc.id}')" class="btn btn-sm btn-outline-danger">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>`;
  });
}

document.getElementById('addEventManagerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('eventManagerName').value.trim();
  if (!name) return;
  
  await db.collection('eventManagers').add({
    name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  
  document.getElementById('eventManagerName').value = '';
  loadEventManagers();
});

async function deleteEventManager(id) {
  if (!confirm('Delete this event manager?')) return;
  await db.collection('eventManagers').doc(id).delete();
  loadEventManagers();
}

window.deleteEventManager = deleteEventManager;
document.addEventListener('DOMContentLoaded', loadEventManagers);
</script>
</body>
</html>
